name: Build HealthCheckIn APK

on:
  push:
    branches:
      - tmp-healthcheckin-apk-build
      - tmp-healthcheckin-apk-v2
      - tmp-healthcheckin-apk-v21

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: healthcheckin-apk
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp healthcheckin-apk/app/build/outputs/apk/debug/app-debug.apk "身体恢复打卡_V2.1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: healthcheckin-apk-v21
          path: 身体恢复打卡_V2.1.apk
          retention-days: 1
