<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f4e">
<title>身体恢复打卡</title>
<style>
:root{--bg:#f5f7f5;--card:#fff;--text:#172019;--muted:#66736b;--primary:#2f6f4e;--line:#e3e9e5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:88px}header{padding:20px 18px 10px}h1{font-size:25px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.page{display:none;padding:0 14px 18px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px rgba(20,55,35,.035)}
.phase{background:linear-gradient(135deg,#eef8f1,#f9fcfa);border-color:#d9e9dd}.kicker{font-size:12px;color:var(--primary);font-weight:700}.title{font-size:19px;font-weight:700;margin:4px 0 7px}.desc{font-size:14px;line-height:1.65;color:#526158}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input[type=number],input[type=date],textarea{width:100%;padding:12px;border:1px solid #d8e1db;border-radius:12px;background:#fff;font-size:16px;color:var(--text);outline:none}textarea{min-height:92px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e6ece8;font-size:15px}.check:last-child{border-bottom:0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
.rangeRow{display:flex;align-items:center;gap:12px}.rangeRow input{flex:1;accent-color:var(--primary)}.badge{display:inline-block;background:#eaf4ed;color:var(--primary);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.progress{height:12px;border-radius:99px;background:#e7ece9;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),#5da577);width:0%}
.btn{display:block;width:100%;padding:13px 16px;border-radius:13px;border:0;font-size:16px;font-weight:700;margin:10px 0}.primary{background:var(--primary);color:#fff}.secondary{background:#eef3f0;color:#31563f}.danger{background:#fff0f0;color:#934040;border:1px solid #f0d4d4}
.stat{font-size:28px;font-weight:800}.statlabel{font-size:12px;color:var(--muted);margin-top:2px}.mini{padding:12px;border-radius:14px;background:#f7faf8;border:1px solid #e7ece9}
.history-item{padding:13px 2px;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}.history-date{font-weight:750}.history-meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}.empty{text-align:center;color:var(--muted);padding:35px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20}.navin{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:7px 2px;color:#6c7770;font-size:12px}.nav button.active{color:var(--primary);font-weight:800}.nav .ico{font-size:21px;display:block;margin-bottom:2px}
.note{font-size:12px;color:var(--muted);line-height:1.6}hr{border:0;border-top:1px solid var(--line);margin:16px 0}canvas{width:100%;height:180px;border-radius:12px;background:#fbfdfb}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#213328;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}@media(max-width:390px){.grid{grid-template-columns:1fr}.stat{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header><h1>身体恢复打卡</h1><div class="sub">12周恢复计划 · 数据只保存在本机</div></header>
<section id="today" class="page active">
<div class="card phase"><div class="kicker" id="todayDate"></div><div class="title" id="phaseName"></div><div class="desc" id="phaseDesc"></div><hr><div class="desc" id="phaseGoals"></div></div>
<div class="card"><div class="title">今天的数据</div><div class="grid">
<div class="field"><label>体重 kg（可选）</label><input id="weight" type="number" step="0.1" placeholder="例如 73.8"></div>
<div class="field"><label>睡眠小时</label><input id="sleep" type="number" step="0.1" placeholder="例如 7.5"></div>
<div class="field"><label>步行 / 活动分钟</label><input id="walk" type="number" step="1" placeholder="例如 30"></div>
<div class="field"><label>抽烟数量</label><input id="cigs" type="number" step="1" placeholder="真实记录即可"></div>
<div class="field"><label>槟榔数量</label><input id="betel" type="number" step="1" placeholder="按固定口径记录"></div></div>
<div class="check"><input id="strength" type="checkbox"><span>今天完成力量训练</span></div><div class="check"><input id="sugary" type="checkbox"><span>今天喝了含糖饮料</span></div><div class="check"><input id="snack" type="checkbox"><span>今天吃了夜宵</span></div>
<div class="field"><label>今日精力：<span id="energyText">3 / 5</span></label><div class="rangeRow"><span>低</span><input id="energy" type="range" min="1" max="5" value="3"><span>高</span></div></div>
<div class="field"><label>备注</label><textarea id="note" placeholder="今天哪里不舒服、为什么累、做得好的地方……"></textarea></div></div>
<div class="card"><div class="title">今日核心完成度 <span class="badge" id="progressText">0%</span></div><div class="progress"><div id="progressBar"></div></div><div class="note" style="margin-top:9px">核心项按睡眠、活动、无含糖饮料、无夜宵计算。烟与槟榔单独看趋势，不把一次失误算成整天失败。</div></div>
<button class="btn primary" onclick="saveToday()">保存今天打卡</button></section>
<section id="history" class="page"><div class="card"><div class="title">历史记录</div><div id="historyList"></div></div></section>
<section id="stats" class="page"><div class="card phase"><div class="kicker">当前计划</div><div class="title" id="statsPhase"></div><div class="desc" id="statsPhaseDesc"></div></div><div class="grid">
<div class="mini"><div class="stat" id="streak">0</div><div class="statlabel">连续打卡天数</div></div><div class="mini"><div class="stat" id="avgSleep">--</div><div class="statlabel">近7天平均睡眠 h</div></div><div class="mini"><div class="stat" id="walk7">0</div><div class="statlabel">近7天活动 min</div></div><div class="mini"><div class="stat" id="strength7">0</div><div class="statlabel">近7天力量训练次</div></div><div class="mini"><div class="stat" id="smokeFree7">0</div><div class="statlabel">近7天无烟天</div></div><div class="mini"><div class="stat" id="betelFree7">0</div><div class="statlabel">近7天无槟榔天</div></div></div>
<div class="card"><div class="title">体重趋势</div><canvas id="weightCanvas" width="640" height="220"></canvas><div class="note" id="weightSummary"></div></div></section>
<section id="settings" class="page"><div class="card"><div class="title">计划设置</div><div class="field"><label>12周计划开始日期</label><input id="startDate" type="date"></div><div class="grid"><div class="field"><label>起始体重 kg</label><input id="initialWeight" type="number" step="0.1"></div><div class="field"><label>长期目标体重 kg</label><input id="targetWeight" type="number" step="0.1"></div><div class="field"><label>睡眠目标 h</label><input id="sleepGoal" type="number" step="0.1"></div></div><button class="btn primary" onclick="saveSettings()">保存设置</button></div>
<div class="card"><div class="title">数据备份</div><div class="note">所有数据保存在本机。建议偶尔导出备份；换手机时可以恢复。</div><button class="btn secondary" onclick="exportData()">导出备份 JSON</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"><button class="btn secondary" onclick="document.getElementById('importFile').click()">从备份恢复</button><button class="btn danger" onclick="clearAll()">清空全部数据</button></div>
<div class="card"><div class="title">说明</div><div class="desc">这不是医疗诊断工具，只用于记录生活方式和趋势。如出现持续明显不适，应及时就医。</div></div></section></div>
<div class="nav"><div class="navin"><button class="active" onclick="showPage('today',this)"><span class="ico">✓</span>今天</button><button onclick="showPage('history',this)"><span class="ico">▤</span>历史</button><button onclick="showPage('stats',this)"><span class="ico">▥</span>统计</button><button onclick="showPage('settings',this)"><span class="ico">⚙</span>设置</button></div></div><div id="toast" class="toast"></div>
<script>
const KEY_REC='health_checkin_records_v1',KEY_SET='health_checkin_settings_v1';
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function addDays(s,n){let d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)}function daysBetween(a,b){return Math.floor((parseDate(b)-parseDate(a))/86400000)}
function getSettings(){let d={startDate:localDate(),initialWeight:74,targetWeight:62.5,sleepGoal:7.5};try{Object.assign(d,JSON.parse(localStorage.getItem(KEY_SET)||'{}'))}catch(e){}return d}function getRecords(){try{return JSON.parse(localStorage.getItem(KEY_REC)||'{}')}catch(e){return {}}}function saveRecords(r){localStorage.setItem(KEY_REC,JSON.stringify(r))}
function weekFor(date){let w=Math.floor(Math.max(0,daysBetween(getSettings().startDate,date))/7)+1;return Math.min(12,w)}function phase(w){if(w<=2)return{name:'阶段1 · 稳定恢复',desc:'重点：睡眠稳定、每天轻快步行、调整饮食结构，不追求高强度训练。',walk:150,strength:0,weight:'第4周参考：72.5–73.5 kg'};if(w<=6)return{name:'阶段2 · 恢复体能',desc:'重点：每周逐步达到约150分钟活动，并完成2次力量训练。',walk:150,strength:2,weight:'第8周参考：71–72.5 kg'};return{name:'阶段3 · 正常成年人模式',desc:'重点：每周150–210分钟活动，力量训练提高到3次，继续稳定减脂。',walk:180,strength:3,weight:'第12周参考：69–71 kg'}}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='history')renderHistory();if(id==='stats')renderStats();if(id==='settings')renderSettings();scrollTo(0,0)}
function renderToday(){const today=localDate(),w=weekFor(today),p=phase(w),s=getSettings();todayDate.textContent=`${today} · 第${w}周`;phaseName.textContent=p.name;phaseDesc.textContent=p.desc;phaseGoals.innerHTML=`睡眠：${s.sleepGoal}小时左右<br>活动：约${p.walk}分钟/周<br>${p.strength===0?'力量训练：前2周不强制':`力量训练：${p.strength}次/周`}<br>${p.weight}`;const r=getRecords()[today];['weight','sleep','walk','cigs','betel','note'].forEach(id=>document.getElementById(id).value=r?.[id]??'');strength.checked=!!r?.strength;sugary.checked=!!r?.sugary;snack.checked=!!r?.snack;energy.value=r?.energy??3;energyText.textContent=`${energy.value} / 5`;updateProgress()}
function num(id){let v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)?v:0}function updateProgress(){let done=0,s=getSettings();if(num('sleep')>=s.sleepGoal)done++;if(num('walk')>=30)done++;if(!sugary.checked)done++;if(!snack.checked)done++;let pc=Math.round(done/4*100);progressText.textContent=pc+'%';progressBar.style.width=pc+'%'}
function saveToday(){const today=localDate(),r=getRecords();r[today]={date:today,week:weekFor(today),weight:weight.value===''?null:num('weight'),sleep:num('sleep'),walk:Math.round(num('walk')),cigs:Math.round(num('cigs')),betel:Math.round(num('betel')),strength:strength.checked,sugary:sugary.checked,snack:snack.checked,energy:+energy.value,note:note.value.trim(),updatedAt:Date.now()};saveRecords(r);updateProgress();toastMsg('今天已保存 ✓')}
function renderHistory(){const arr=Object.values(getRecords()).sort((a,b)=>b.date.localeCompare(a.date));historyList.innerHTML=arr.length?'':'<div class="empty">还没有历史打卡<br>先完成今天第一条记录吧</div>';arr.forEach(r=>{let d=document.createElement('div');d.className='history-item';d.innerHTML=`<div class="history-date">${r.date} · 第${r.week||weekFor(r.date)}周</div><div class="history-meta">睡眠 ${r.sleep||0} h · 活动 ${r.walk||0} min · 体重 ${r.weight??'--'} kg<br>力量 ${r.strength?'✓':'—'} · 烟 ${r.cigs||0} · 槟榔 ${r.betel||0} · 精力 ${r.energy||3}/5<br>${r.sugary?'含糖饮料：有':'含糖饮料：无'} · ${r.snack?'夜宵：有':'夜宵：无'}</div>`;historyList.appendChild(d)})}
function renderStats(){const today=localDate(),w=weekFor(today),p=phase(w);statsPhase.textContent=`第${w}周 / 12周 · ${p.name}`;statsPhaseDesc.textContent=p.desc;let rec=getRecords(),last7=[];for(let i=6;i>=0;i--){let d=addDays(today,-i);if(rec[d])last7.push(rec[d])}avgSleep.textContent=last7.length?(last7.reduce((a,x)=>a+(x.sleep||0),0)/last7.length).toFixed(1):'--';walk7.textContent=last7.reduce((a,x)=>a+(x.walk||0),0);strength7.textContent=last7.filter(x=>x.strength).length;smokeFree7.textContent=last7.filter(x=>(x.cigs||0)===0).length;betelFree7.textContent=last7.filter(x=>(x.betel||0)===0).length;let st=0,expected=today;if(!rec[expected])expected=addDays(expected,-1);while(rec[expected]){st++;expected=addDays(expected,-1)}streak.textContent=st;drawWeight()}
function drawWeight(){let arr=Object.values(getRecords()).filter(x=>x.weight!=null).sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);const c=weightCanvas,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfdfb';ctx.fillRect(0,0,c.width,c.height);if(arr.length<2){ctx.fillStyle='#718078';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('至少记录2次体重后显示趋势',c.width/2,c.height/2);weightSummary.textContent=arr.length?`最近体重：${arr[0].weight} kg`:'暂无体重数据';return}let vals=arr.map(x=>x.weight),min=Math.min(...vals)-.5,max=Math.max(...vals)+.5,L=45,R=18,T=22,B=35,W=c.width-L-R,H=c.height-T-B;ctx.strokeStyle='#e3e9e5';for(let i=0;i<4;i++){let y=T+H*i/3;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+W,y);ctx.stroke()}ctx.strokeStyle='#2f6f4e';ctx.lineWidth=4;ctx.beginPath();arr.forEach((x,i)=>{let px=L+W*i/(arr.length-1),py=T+H*(max-x.weight)/(max-min);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();let ch=(arr[arr.length-1].weight-arr[0].weight).toFixed(1);weightSummary.textContent=`最近：${arr[arr.length-1].weight} kg · 近${arr.length}次记录变化：${ch>0?'+':''}${ch} kg · 长期目标：${getSettings().targetWeight} kg`}
function renderSettings(){let s=getSettings();startDate.value=s.startDate;initialWeight.value=s.initialWeight;targetWeight.value=s.targetWeight;sleepGoal.value=s.sleepGoal}function saveSettings(){let s={startDate:startDate.value||localDate(),initialWeight:+initialWeight.value||74,targetWeight:+targetWeight.value||62.5,sleepGoal:+sleepGoal.value||7.5};localStorage.setItem(KEY_SET,JSON.stringify(s));renderToday();toastMsg('设置已保存')}
function exportData(){let data={version:1,exportedAt:new Date().toISOString(),settings:getSettings(),records:getRecords()},text=JSON.stringify(data,null,2);if(window.Android&&typeof Android.saveBackup==='function'){Android.saveBackup(text);return}let blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`身体恢复打卡_备份_${localDate()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!d.records)throw 0;localStorage.setItem(KEY_REC,JSON.stringify(d.records));if(d.settings)localStorage.setItem(KEY_SET,JSON.stringify(d.settings));renderToday();toastMsg('备份恢复成功')}catch(err){alert('备份文件无法识别')}};rd.readAsText(f);e.target.value=''}
function clearAll(){if(confirm('确定清空全部打卡记录？此操作不可撤销。')){localStorage.removeItem(KEY_REC);renderToday();toastMsg('历史记录已清空')}}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
energy.oninput=()=>energyText.textContent=`${energy.value} / 5`;['sleep','walk','sugary','snack'].forEach(id=>document.getElementById(id).addEventListener('input',updateProgress));renderToday();
</script>
</body>
</html>
