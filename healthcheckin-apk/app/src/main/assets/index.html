<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315f49"><title>身体恢复打卡</title><style>
:root{--bg:#f6f8f6;--card:#fff;--text:#162019;--muted:#738078;--green:#315f49;--green2:#4d8067;--mint:#eaf4ed;--line:#e6ece8;--warm:#fff4e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:700px;margin:auto;padding-bottom:92px}.top{padding:24px 18px 8px}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.8px}.top h1{font-size:28px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.page{display:none;padding:0 14px 20px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:11px 0;box-shadow:0 4px 20px rgba(33,67,47,.045)}.hero{background:linear-gradient(145deg,#315f49,#4f876b);color:#fff;border:0;padding:20px}.hero .muted{color:#dce9e1}.heroRow{display:flex;align-items:center;gap:18px}.ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d8f0df var(--pc,0%),rgba(255,255,255,.18) 0);position:relative;flex:0 0 auto}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#3b6c54}.ring span{position:relative;z-index:2;font-size:19px;font-weight:800}.title{font-size:19px;font-weight:800;margin:2px 0 8px}.desc{font-size:14px;line-height:1.65}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8faf8;border:1px solid var(--line);border-radius:16px;padding:13px}.metric b{display:block;font-size:20px}.metric span{font-size:12px;color:var(--muted)}label{font-size:13px;font-weight:700;display:block;margin:11px 0 6px}input[type=number],input[type=time],input[type=date],textarea,select{width:100%;border:1px solid #dbe4de;border-radius:13px;padding:12px;background:#fff;font-size:16px;color:var(--text)}textarea{min-height:84px;resize:vertical}.checks{margin-top:8px}.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.check:last-child{border:0}.check input{width:20px;height:20px;accent-color:var(--green)}input[type=range]{width:100%;accent-color:var(--green)}.btn{width:100%;border:0;border-radius:14px;padding:13px 15px;margin-top:10px;font-size:16px;font-weight:800}.primary{background:var(--green);color:white}.soft{background:var(--mint);color:var(--green)}.danger{background:#fff0f0;color:#984444}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:9}.navin{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#79857e;font-size:11px;padding:6px 0}.nav button.active{color:var(--green);font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.reviewScore{font-size:34px;font-weight:900;color:var(--green)}.summary{background:var(--warm);border:1px solid #f3e2c8;border-radius:16px;padding:13px;line-height:1.65;font-size:14px}.historyItem{padding:13px 2px;border-bottom:1px solid var(--line)}.historyItem:last-child{border:0}.historyItem b{font-size:15px}.historyItem p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.stat{font-size:26px;font-weight:900}.statLabel{font-size:12px;color:var(--muted)}canvas{width:100%;height:180px;background:#fbfdfb;border-radius:14px}.switchRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.switchRow input{width:22px;height:22px;accent-color:var(--green)}.alarmBox{background:#f1f7f3;border:1px solid #dce9e0;border-radius:18px;padding:14px}.alarmTimes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#203229;color:#fff;padding:10px 14px;border-radius:11px;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1}@media(max-width:390px){.grid2,.alarmTimes{grid-template-columns:1fr}.heroRow{align-items:flex-start}.ring{width:78px;height:78px}}
</style></head><body><div class="app"><div class="top"><div class="eyebrow">12 WEEK RESET</div><h1 id="greeting">身体恢复计划</h1><div class="muted" id="dateLine"></div></div>
<section id="today" class="page active"><div class="card hero"><div class="heroRow"><div class="ring" id="ring"><span id="ringText">0%</span></div><div><div class="muted" id="weekText"></div><div class="title" id="phaseName"></div><div class="desc" id="phaseDesc"></div></div></div></div><div class="grid2"><div class="metric"><b id="mSleep">--</b><span>睡眠 / h</span></div><div class="metric"><b id="mWalk">--</b><span>活动 / min</span></div></div><div class="card"><div class="title">今日记录</div><div class="grid2"><div><label>体重 kg</label><input id="weight" type="number" step="0.1" placeholder="可选"></div><div><label>睡眠小时</label><input id="sleep" type="number" step="0.1" placeholder="7.5"></div><div><label>活动分钟</label><input id="walk" type="number" placeholder="30"></div><div><label>抽烟支数</label><input id="cigs" type="number" placeholder="真实记录"></div><div><label>槟榔数量</label><input id="betel" type="number" placeholder="真实记录"></div></div><div class="checks"><div class="check"><input id="strength" type="checkbox"><span>完成力量训练</span></div><div class="check"><input id="sugary" type="checkbox"><span>喝了含糖饮料</span></div><div class="check"><input id="snack" type="checkbox"><span>吃了夜宵</span></div></div><label>今日精力：<span id="energyText">3 / 5</span></label><input id="energy" type="range" min="1" max="5" value="3"><label>备注</label><textarea id="note" placeholder="不舒服、疲劳原因、值得记录的事情……"></textarea><button class="btn primary" onclick="saveToday()">保存今日打卡</button></div></section>
<section id="review" class="page"><div class="card"><div class="eyebrow">DAILY REVIEW</div><div class="title">睡前2分钟复盘</div><div class="muted">不用写长篇，留下能让明天更好的关键信息。</div><label>今天整体状态</label><div class="reviewScore"><span id="reviewScoreText">3</span><small style="font-size:15px;color:#76827a"> / 5</small></div><input id="reviewScore" type="range" min="1" max="5" value="3"><label>今天做得最好的一件事</label><textarea id="reviewWin" placeholder="哪怕只是按时吃饭、少抽了两支烟也算"></textarea><label>最影响今天状态的因素</label><select id="reviewFactor"><option>睡眠不足</option><option>工作压力</option><option>烟或槟榔</option><option>饮食</option><option>运动不足</option><option>情绪</option><option>其他</option></select><label>身体 / 情绪需要注意什么</label><textarea id="reviewBody" placeholder="例如肩颈酸、犯困、烦躁、胃不舒服……"></textarea><label>明天唯一的小目标</label><textarea id="reviewTomorrow" placeholder="只写一个最容易执行的小目标"></textarea><div class="summary" id="autoSummary">完成今日打卡后，这里会自动生成一条小结。</div><button class="btn primary" onclick="saveReview()">保存今日复盘</button></div></section>
<section id="stats" class="page"><div class="grid2"><div class="metric"><b class="stat" id="streak">0</b><span>连续打卡天</span></div><div class="metric"><b class="stat" id="avgSleep">--</b><span>近7天平均睡眠</span></div><div class="metric"><b class="stat" id="walk7">0</b><span>近7天活动分钟</span></div><div class="metric"><b class="stat" id="strength7">0</b><span>近7天力量训练</span></div></div><div class="card"><div class="title">体重趋势</div><canvas id="weightCanvas" width="640" height="220"></canvas><div class="muted" id="weightSummary"></div></div><div class="card"><div class="title">烟 / 槟榔趋势</div><div class="desc" id="habitSummary"></div></div></section>
<section id="history" class="page"><div class="card"><div class="title">历史记录</div><div id="historyList"></div></div></section>
<section id="settings" class="page"><div class="card"><div class="title">恢复计划</div><div class="grid2"><div><label>计划开始日</label><input id="startDate" type="date"></div><div><label>睡眠目标 h</label><input id="sleepGoal" type="number" step="0.1"></div><div><label>起始体重 kg</label><input id="initialWeight" type="number" step="0.1"></div><div><label>长期目标 kg</label><input id="targetWeight" type="number" step="0.1"></div></div><button class="btn soft" onclick="saveSettings()">保存计划设置</button></div><div class="card"><div class="title">睡眠与起床闹钟</div><div class="alarmBox"><div class="alarmTimes"><div><label>计划睡觉时间</label><input id="bedtime" type="time" value="23:00"></div><div><label>起床时间</label><input id="wakeTime" type="time" value="06:30"></div></div><div class="switchRow"><span>睡前 60 分钟提醒</span><input id="alarmHour" type="checkbox" checked></div><div class="switchRow"><span>睡前 30 分钟提醒</span><input id="alarmHalf" type="checkbox" checked></div><div class="switchRow"><span>起床闹钟</span><input id="alarmWake" type="checkbox" checked></div><button class="btn primary" onclick="saveAlarms()">启用 / 更新闹钟</button><div class="muted" id="alarmStatus">首次安装请允许通知权限。</div></div></div><div class="card"><div class="title">数据</div><button class="btn soft" onclick="exportData()">导出备份</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="btn soft" onclick="importFile.click()">恢复备份</button><button class="btn danger" onclick="clearAll()">清空历史数据</button></div></section></div>
<div class="nav"><div class="navin"><button class="active" onclick="showPage('today',this)"><i>◉</i>今日</button><button onclick="showPage('review',this)"><i>✎</i>复盘</button><button onclick="showPage('stats',this)"><i>⌁</i>趋势</button><button onclick="showPage('history',this)"><i>▤</i>历史</button><button onclick="showPage('settings',this)"><i>⚙</i>设置</button></div></div><div class="toast" id="toast"></div><script>
const KR='health_records_v2',KS='health_settings_v2',KV='health_reviews_v2';function dstr(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),q=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${q}`}function pdate(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}function add(s,n){let d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)}function days(a,b){return Math.floor((pdate(b)-pdate(a))/86400000)}function settings(){let x={startDate:dstr(),sleepGoal:7.5,initialWeight:74,targetWeight:62.5};try{Object.assign(x,JSON.parse(localStorage.getItem(KS)||'{}'))}catch(e){}return x}function records(){try{return JSON.parse(localStorage.getItem(KR)||'{}')}catch(e){return{}}}function reviews(){try{return JSON.parse(localStorage.getItem(KV)||'{}')}catch(e){return{}}}function week(date){return Math.min(12,Math.floor(Math.max(0,days(settings().startDate,date))/7)+1)}function phase(w){if(w<=2)return['稳定恢复','先把睡眠、步行和饮食节奏稳下来，不追求高强度。'];if(w<=6)return['恢复体能','逐步达到每周约150分钟活动，并加入每周2次力量训练。'];return['建立长期节奏','把活动和力量训练变成稳定习惯，同时继续减脂。']}function num(id){let v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)?v:0}function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='review')renderReview();if(id==='stats')renderStats();if(id==='history')renderHistory();if(id==='settings')renderSettings();scrollTo(0,0)}function greet(){let h=new Date().getHours();greeting.textContent=h<10?'早上好，今天稳稳来':h<18?'今天也别把自己耗空':'晚上好，开始收尾';dateLine.textContent=dstr()+' · 身体恢复优先'}
function renderToday(){let t=dstr(),r=records()[t],w=week(t),p=phase(w);weekText.textContent=`第 ${w} 周 / 12 周`;phaseName.textContent=p[0];phaseDesc.textContent=p[1];['weight','sleep','walk','cigs','betel','note'].forEach(id=>document.getElementById(id).value=r?.[id]??'');strength.checked=!!r?.strength;sugary.checked=!!r?.sugary;snack.checked=!!r?.snack;energy.value=r?.energy||3;energyText.textContent=energy.value+' / 5';refreshToday()}function refreshToday(){let s=settings(),done=0;if(num('sleep')>=s.sleepGoal)done++;if(num('walk')>=30)done++;if(!sugary.checked)done++;if(!snack.checked)done++;let pc=Math.round(done/4*100);ring.style.setProperty('--pc',pc+'%');ringText.textContent=pc+'%';mSleep.textContent=sleep.value||'--';mWalk.textContent=walk.value||'--'}function saveToday(){let t=dstr(),x=records();x[t]={date:t,week:week(t),weight:weight.value===''?null:num('weight'),sleep:num('sleep'),walk:Math.round(num('walk')),cigs:Math.round(num('cigs')),betel:Math.round(num('betel')),strength:strength.checked,sugary:sugary.checked,snack:snack.checked,energy:+energy.value,note:note.value.trim()};localStorage.setItem(KR,JSON.stringify(x));refreshToday();toastMsg('今日打卡已保存');renderReview()}
function autoText(){let r=records()[dstr()],s=settings();if(!r)return'先完成今日打卡，我会根据今天的数据给你一条简短小结。';let a=[];if(r.sleep<s.sleepGoal)a.push('睡眠没有达到目标，今晚优先保证上床时间');else a.push('睡眠达到目标，继续保持');if(r.walk<30)a.push('活动量偏少，明天争取饭后走一走');if(r.cigs>0)a.push(`今天记录了${r.cigs}支烟，只看趋势，不自责`);if(r.betel>0)a.push(`槟榔记录${r.betel}，继续往减少和停止方向走`);if(r.energy<=2)a.push('精力偏低，明天别额外加码');return a.join('；')+'。'}function renderReview(){let v=reviews()[dstr()];reviewScore.value=v?.score||3;reviewScoreText.textContent=reviewScore.value;reviewWin.value=v?.win||'';reviewFactor.value=v?.factor||'睡眠不足';reviewBody.value=v?.body||'';reviewTomorrow.value=v?.tomorrow||'';autoSummary.textContent=autoText()}function saveReview(){let x=reviews();x[dstr()]={score:+reviewScore.value,win:reviewWin.value.trim(),factor:reviewFactor.value,body:reviewBody.value.trim(),tomorrow:reviewTomorrow.value.trim()};localStorage.setItem(KV,JSON.stringify(x));toastMsg('今日复盘已保存')}
function renderStats(){let rec=records(),t=dstr(),a=[];for(let i=6;i>=0;i--){let r=rec[add(t,-i)];if(r)a.push(r)}avgSleep.textContent=a.length?(a.reduce((z,x)=>z+x.sleep,0)/a.length).toFixed(1):'--';walk7.textContent=a.reduce((z,x)=>z+x.walk,0);strength7.textContent=a.filter(x=>x.strength).length;let st=0,e=t;if(!rec[e])e=add(e,-1);while(rec[e]){st++;e=add(e,-1)}streak.textContent=st;habitSummary.textContent=`近7天记录：抽烟 ${a.reduce((z,x)=>z+x.cigs,0)} 支，槟榔 ${a.reduce((z,x)=>z+x.betel,0)}。重点看趋势是否往下，不用追求某一天完美。`;drawWeight()}function drawWeight(){let a=Object.values(records()).filter(x=>x.weight!=null).sort((x,y)=>x.date.localeCompare(y.date)).slice(-30),c=weightCanvas,g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(a.length<2){g.fillStyle='#758079';g.font='23px sans-serif';g.textAlign='center';g.fillText('至少记录2次体重后显示趋势',c.width/2,c.height/2);weightSummary.textContent=a.length?'最近体重 '+a[0].weight+' kg':'暂无体重记录';return}let v=a.map(x=>x.weight),mn=Math.min(...v)-.5,mx=Math.max(...v)+.5,L=45,T=20,W=570,H=160;g.strokeStyle='#e4ebe6';for(let i=0;i<4;i++){let y=T+H*i/3;g.beginPath();g.moveTo(L,y);g.lineTo(L+W,y);g.stroke()}g.strokeStyle='#315f49';g.lineWidth=4;g.beginPath();a.forEach((x,i)=>{let px=L+W*i/(a.length-1),py=T+H*(mx-x.weight)/(mx-mn);i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();let ch=(a.at(-1).weight-a[0].weight).toFixed(1);weightSummary.textContent=`最近 ${a.at(-1).weight} kg · 近${a.length}次变化 ${ch>0?'+':''}${ch} kg · 长期目标 ${settings().targetWeight} kg`}
function renderHistory(){let a=Object.values(records()).sort((x,y)=>y.date.localeCompare(x.date));historyList.innerHTML=a.length?'':'<div class="muted" style="padding:30px;text-align:center">还没有历史记录</div>';a.forEach(r=>{let v=reviews()[r.date],d=document.createElement('div');d.className='historyItem';d.innerHTML=`<b>${r.date} · 第${r.week}周</b><p>睡眠 ${r.sleep}h · 活动 ${r.walk}min · 体重 ${r.weight??'--'}kg<br>烟 ${r.cigs} · 槟榔 ${r.betel} · 精力 ${r.energy}/5${v?`<br>复盘 ${v.score}/5 · 明天：${v.tomorrow||'未填写'}`:''}</p>`;historyList.appendChild(d)})}
function renderSettings(){let s=settings();startDate.value=s.startDate;sleepGoal.value=s.sleepGoal;initialWeight.value=s.initialWeight;targetWeight.value=s.targetWeight;try{if(window.Android){let a=JSON.parse(Android.getAlarmSettings());bedtime.value=a.bedtime;wakeTime.value=a.wake;alarmHour.checked=a.hour;alarmHalf.checked=a.half;alarmWake.checked=a.wakeEnabled}}catch(e){}}function saveSettings(){localStorage.setItem(KS,JSON.stringify({startDate:startDate.value||dstr(),sleepGoal:+sleepGoal.value||7.5,initialWeight:+initialWeight.value||74,targetWeight:+targetWeight.value||62.5}));renderToday();toastMsg('计划设置已保存')}function saveAlarms(){if(window.Android){Android.scheduleAlarms(bedtime.value||'23:00',wakeTime.value||'06:30',alarmHour.checked,alarmHalf.checked,alarmWake.checked);alarmStatus.textContent=`已设置：睡觉 ${bedtime.value} · 起床 ${wakeTime.value}`;}else alarmStatus.textContent='当前不是APK环境，无法启用系统闹钟。'}
function exportData(){let text=JSON.stringify({version:2,settings:settings(),records:records(),reviews:reviews()},null,2);if(window.Android)Android.saveBackup(text)}function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(d.records)localStorage.setItem(KR,JSON.stringify(d.records));if(d.settings)localStorage.setItem(KS,JSON.stringify(d.settings));if(d.reviews)localStorage.setItem(KV,JSON.stringify(d.reviews));renderToday();toastMsg('恢复成功')}catch(x){alert('备份文件无法识别')}};rd.readAsText(f);e.target.value=''}function clearAll(){if(confirm('确定清空打卡和复盘记录？')){localStorage.removeItem(KR);localStorage.removeItem(KV);renderToday();toastMsg('已清空')}}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}energy.oninput=()=>energyText.textContent=energy.value+' / 5';reviewScore.oninput=()=>reviewScoreText.textContent=reviewScore.value;['sleep','walk','sugary','snack'].forEach(x=>document.getElementById(x).addEventListener('input',refreshToday));greet();renderToday();
</script></body></html>
